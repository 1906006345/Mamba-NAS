name: mamba-tsc-nas
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.4.0
  - torchvision=0.19.0
  - torchaudio=2.4.0
  - pytorch-cuda=11.8
  - cuda-nvcc=11.8
  - gcc=11
  - gxx=11
  - ninja
  - packaging
  - pip:
      - numpy>=1.24,<2.0
      - pandas>=2.0
      - scikit-learn>=1.3
      - sktime>=0.30
      - pymoo>=0.6.1
      - cloudpickle>=3.0
      - einops>=0.7
      - pyyaml>=6
      - matplotlib>=3.8
      - seaborn>=0.13
      - tensorboard>=2.16
      - pytest>=8

# Install compiled packages after environment creation with --no-build-isolation:
# pip install causal-conv1d==1.4.0 --no-build-isolation
# pip install mamba-ssm==2.1.0 --no-build-isolation
