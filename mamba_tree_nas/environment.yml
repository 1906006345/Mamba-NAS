# Optional fresh Linux/WSL2 NVIDIA environment, not a GPU-validated lockfile.
# Existing working Mamba Conda environments can install requirements.txt instead.
name: mamba-tree-nas
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - numpy>=1.26,<3
  - scipy>=1.11
  - scikit-learn>=1.3
  - pyyaml>=6
  - matplotlib>=3.8
  - tensorboard>=2.15
  - pytest>=8
  - packaging
  - ninja
  - einops
  - setuptools
# Install official mamba-ssm / causal-conv1d AFTER PyTorch, with the server's
# matching CUDA toolkit/wheels. See README; no uv and no automatic installer.
