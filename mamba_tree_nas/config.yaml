version: 1
deployment_nas:
  version: 1
  datasets:
    Heartbeat: tree_multiscale_forward
    PEMS-SF: tree_multiscale_direction
    SpokenArabicDigits: tree_multiscale_direction
  search_seeds: [52021, 52022, 52023]
  training_seeds: [11001, 11002, 11003]
  sampling_seed: 62003
  target_gpu: L20
  panel_size: 32
  rate_pairs: 8
  benchmark: {rounds: 3, warmup: 30, repeats: 100, throughput_batch: 32}
  search: {population: 200, budget: 800}
  reference_epochs: 100
  supernet_epochs: 30
  checkpoints: [200, 400, 600, 800]
  audit_quota: 3
  scale_multiplier: 2.0
  hv_reference: [1.1, 1.1, 1.1]
  profiles:
    paper: {}
    pilot:
      search_seeds: [52021]
      panel_size: 8
      rate_pairs: 3
      search: {population: 4, budget: 8}
      reference_epochs: 12
      supernet_epochs: 3
      checkpoints: [4, 8]
    smoke:
      search_seeds: [52021]
      training_seeds: [11001, 11002, 11003]
      panel_size: 6
      rate_pairs: 2
      benchmark: {rounds: 2, warmup: 1, repeats: 3, throughput_batch: 2}
      search: {population: 3, budget: 6}
      reference_epochs: 3
      supernet_epochs: 2
      checkpoints: [3, 6]
      audit_quota: 2
temporal_followup:
  version: 1
  datasets: [Heartbeat, PEMS-SF, SpokenArabicDigits]
  search_seeds: [52021, 52022, 52023, 52024, 52025]
  arms: [original, matched_random, single]
  source_seeds: [2021, 2022, 2023]
  window: 0.15
  census_windows: [0.10, 0.15, 0.30]
  sampling_seed: 62002
  smoke_data: {length: 261, channels: 48}
  audit: {architectures: 2, seeds: [11001, 11002, 11003], repeats: 2, epochs: 30}
  diagnostic: {parents: 12, children: 2, seeds: [11001, 11002, 11003], epochs: 30}
  search: {population: 24, budget: 96}
  profiles:
    paper: {}
    pilot:
      search_seeds: [52021]
      audit: {architectures: 1, seeds: [11001], repeats: 2, epochs: 3}
      diagnostic: {parents: 2, children: 1, seeds: [11001], epochs: 3}
      search: {population: 4, budget: 8}
    smoke:
      search_seeds: [52021]
      audit: {architectures: 2, seeds: [11001], repeats: 2, epochs: 2}
      diagnostic: {parents: 2, children: 1, seeds: [11001], epochs: 2}
      search: {population: 3, budget: 6}
temporal_study:
  policy: {enabled: false, window: 0.15, single_probability: 0.16666666666666666, redistribute_probability: 0.16666666666666666}
  diagnostics: {parents: 12, children_per_operator: 2, fixed_parents: 3, fixed_epochs: 15, sampling_seed: 62001}
  search: {population: 24, budget: 96}
  datasets:
    Heartbeat: {direction: forward, cap: 2100000}
    PEMS-SF: {direction: direction, cap: 9300000}
    SpokenArabicDigits: {direction: direction, cap: 180000}
# Baseline-only settings are read by the traditional-comparison launcher.
# Keeping them outside defaults preserves existing functional-tree manifests.
traditional_baselines:
  serial_experiment: chain_direction
  reference_tree: tree_direction
  variants: {nsga2: traditional_nsga2, random: traditional_random}
  gene_exchange_probability: 0.5
  mutation_probability: 1.0
  gene_mutation_probability: null  # null means 1 / number of active genes
multiscale_smoke_length: 35
multiscale_experiments:
  tree_multiscale_forward: {topology: tree, directions: [F], algorithm: nsga2, multiscale: {rates: [1, 2, 4], min_tokens: 8}}
  tree_multiscale_direction: {topology: tree, directions: [F, B, FB_shared], algorithm: nsga2, multiscale: {rates: [1, 2, 4], min_tokens: 8}}
defaults:
  output: mamba_tree_nas/runs
  exports: mamba_tree_nas/paper_exports
  device: cuda
  backend: mamba
  runtime: {cpu_threads: 1, allow_tf32: false}
  data:
    root: data/UEA
    primary: [Heartbeat, SpokenArabicDigits, PEMS-SF]
    uea10: [EthanolConcentration, FaceDetection, Handwriting, Heartbeat, JapaneseVowels, PEMS-SF, SelfRegulationSCP1, SelfRegulationSCP2, SpokenArabicDigits, UWaveGestureLibrary]
    validation_fraction: 0.2
    split_seed: 2021
    normalization_epsilon: 1.0e-8
    download_url: https://www.timeseriesclassification.com/aeon-toolkit/{dataset}.zip
  seeds:
    search: [2021, 2022, 2023]
    candidate: 11001
    proxy: [21001, 21002, 21003]
    refit: [31001, 31002, 31003]
    calibration: 41001
  experiments:
    chain_forward: {topology: chain, directions: [F], algorithm: nsga2}
    tree_forward: {topology: tree, directions: [F], algorithm: nsga2}
    chain_direction: {topology: chain, directions: [F, B, FB_shared], algorithm: nsga2}
    tree_direction: {topology: tree, directions: [F, B, FB_shared], algorithm: nsga2}
    tree_direction_random: {topology: tree, directions: [F, B, FB_shared], algorithm: random}
  space:
    max_leaves: 3
    max_depth: 3
    tokenizer: [point, patch8, patch16]
    d_model: [64, 128]
    pooling: [mean, max, meanmax]
    d_state: [8, 16]
    d_conv: [2, 4]
    expand: [1, 2]
    sampling: {OP: 0.4, RES: 0.2, SEQ: 0.2, PAR: 0.2}
    max_attempts: 10000
  search:
    population: 24
    budget: 384
    crossover_probability: 0.9
    mutation_probability: 0.3
    mutation_weights: {subtree: 0.5, leaf: 0.3, global: 0.2}
    consecutive_failure_limit: 3
    hv_reference: [1.1, 1.1]
  train:
    epochs: 30
    min_epochs: 5
    patience: 7
    batch_size: 32
    learning_rate: 0.001
    weight_decay: 0.0001
    dropout: 0.1
    gradient_clip: 1.0
    num_workers: 0
    deterministic: true
    precision: fp32
  calibration: {epochs: 100, min_epochs: 10, patience: 15}
  proxy:
    enabled: true
    minimum_batch: 32
    examples_per_class: 2
    epsilon: 1.0e-12
  logging: {tensorboard: true, flush_seconds: 10}
  profiling: {enabled: true, warmup: 10, repeats: 50, throughput_batch: 32}
  retention: {save_first_refit_weights: true, predictions: true}
  report: {top_fraction: 0.1, dpi: 180}
  smoke: {samples: 30, test_samples: 12, channels: 3, length: 17, classes: 3}
profiles:
  paper: {}
  pilot:
    output: mamba_tree_nas/runs_pilot
    exports: mamba_tree_nas/paper_exports_pilot
    search: {population: 8, budget: 24}
    train: {epochs: 8, min_epochs: 3, patience: 3}
    calibration: {epochs: 15, min_epochs: 5, patience: 5}
  smoke:
    device: cpu
    backend: test
    output: mamba_tree_nas/runs_smoke
    exports: mamba_tree_nas/paper_exports_smoke
    search: {population: 3, budget: 5}
    space: {d_model: [8], d_state: [2], d_conv: [2], expand: [1], tokenizer: [point, patch8], pooling: [mean, meanmax]}
    train: {epochs: 2, min_epochs: 1, patience: 1, batch_size: 8}
    calibration: {epochs: 2, min_epochs: 1, patience: 1}
    profiling: {warmup: 1, repeats: 3, throughput_batch: 8}
